name: Build Windows EXE
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install pyinstaller cryptography openpyxl qrcode Pillow

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --paths=source source/app.py

    - name: Automatically Create Production Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: DevSeva Windows Production Release Build #${{ github.run_number }}
        draft: false
        prerelease: false
        files: dist/app.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

